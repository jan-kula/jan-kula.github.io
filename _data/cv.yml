    Projects:
      - name: "GPU-Accelerated FEM Solver; From Heat Equation to Black–Scholes - [Chalmers](https://www.chalmers.se)"
        summary: Created a solver for the heat eqiation using Finite Element Methods. Used graphics cards in HPC environment to speed up calculations.
        highlights:
          -  Learned to use Python and GPU-accelerated libraries such as CuPy and Numba CUDA, alongside standard scientific computing tools like SciPy and NumPy.
          - Gained an understanding of how differences in memory and thread management between the CPU and GPU affect execution, and how algorithms must be adapted and restructured to run efficiently on the GPU.
          - Learned to operate inside of a HPC environment with resource allocation using Bash-scripts.
        start_date: 2025-11
        end_date: 2026-01

      - name: Predicting Molecular Fragmentation Using Graph-to-Graph Models - [AstraZeneca](https://www.astrazeneca.com/)
        summary: In a group of three, reasearched ... and tried to reverse engineer an existing Graph Neural Network used for predicting molecular synthesys to fit our need of predicting molecular fragmentations.
        highlights:
          - Used Python to adapt existing graph-based neural network for our purpose.
          - Learned to quickly familiarize myself with a research-heavy field.
          - Learned to work in a structured manner within a team environment.
        start_date: 2024-11
        end_date: 2025-01

